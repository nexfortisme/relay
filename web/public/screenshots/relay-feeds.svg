      <text x="32" y="408" fill="#d6dce7" font-size="16">brief, and continue in chat.</text>
      <path d="M32 456h238" stroke="#2b3240"/>
      <text x="32" y="504" fill="#9aa5b5" font-size="15">Unread items stay visible until</text>
      <text x="32" y="530" fill="#9aa5b5" font-size="15">you have actually opened them.</text>
