      <stop offset=".52" stop-color="#0f1115"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="facet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
