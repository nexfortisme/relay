<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Relay feeds screenshot</title>
  <desc id="desc">A Relay feeds screenshot showing feed sources, unread items, article preview, and summarization controls.</desc>
  <defs>
