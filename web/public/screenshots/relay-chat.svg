        <path d="M10 17h14M17 10v14" class="icon"/>
        <rect x="42" width="34" height="34" rx="7" fill="#191d27" stroke="#2b3240"/>
        <path d="m54 24 10-14 10 14z" class="icon"/>
        <rect x="84" width="34" height="34" rx="7" fill="#191d27" stroke="#2b3240"/>
        <path d="M95 11h12M97 11v14h8V11" class="icon"/>
      </g>
    </g>

    <g transform="translate(390 178)">
      <rect x="150" width="690" height="116" rx="17" fill="#191d27" stroke="#2b3240"/>
      <text x="188" y="48" class="text" font-size="19" font-weight="650">Summarize unread design and AI feeds from this morning.</text>
      <rect x="188" y="68" width="176" height="30" rx="15" fill="#202533"/>
      <path d="M204 78h16v10h-16z" class="icon"/>
      <text x="230" y="88" class="muted" font-size="13">strategy-notes.pdf</text>

      <rect x="150" y="166" width="820" height="226" rx="17" fill="#111827" stroke="#2b3240"/>
      <svg x="188" y="204" width="34" height="34" viewBox="0 0 140 140">
        <use href="#relay-logo"/>
