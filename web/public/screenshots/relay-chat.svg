      .muted { fill: #9aa5b5; }
      .soft-text { fill: #d6dce7; }
      .divider { stroke: #2b3240; stroke-width: 1.5; }
      .icon { fill: none; stroke: #9aa5b5; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .icon-light { fill: none; stroke: #f4f7fb; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .icon-primary { fill: none; stroke: #ffffff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
