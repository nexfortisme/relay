      <text x="14" y="125" class="muted" font-weight="600">PDF extraction</text>
      <rect y="145" width="170" height="35" rx="7" fill="transparent"/>
      <text x="14" y="168" class="muted" font-weight="600">Trip research</text>
      <rect y="188" width="170" height="35" rx="7" fill="transparent"/>
      <text x="14" y="211" class="muted" font-weight="600">Launch plan</text>
      <text x="0" y="266" class="muted" font-size="12" font-weight="700">ARCHIVED CHATS (2)</text>
    </g>

    <g transform="translate(16 884)">
      <rect width="248" height="52" rx="10" fill="#191d27" stroke="#2b3240"/>
      <circle cx="26" cy="26" r="15" fill="#202533"/>
      <text x="20" y="31" fill="#d6dce7" font-size="13" font-weight="700">D</text>
      <text x="50" y="23" class="text" font-size="13" font-weight="650">david</text>
      <text x="50" y="39" class="muted" font-size="12">Private workspace</text>
    </g>

