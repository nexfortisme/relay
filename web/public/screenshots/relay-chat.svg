      <rect width="1160" height="52" fill="#0f1115"/>
      <path d="M0 52h1160" class="divider"/>
      <g transform="translate(24 10)" font-size="13" font-weight="650">
        <rect width="70" height="31" rx="16" fill="#191d27" stroke="#486a9f"/>
        <text x="35" y="21" class="text" text-anchor="middle">Chat</text>
        <text x="100" y="21" class="muted">Notebooks</text>
        <text x="199" y="21" class="muted">Scheduled</text>
        <text x="301" y="21" class="muted">My Data</text>
        <text x="385" y="21" class="muted">Feeds</text>
      </g>
    </g>

