      <text x="238" y="227" class="text" font-size="20" font-weight="700">Relay</text>
      <text x="188" y="278" class="soft-text" font-size="18">The strongest signal is that teams are converging on smaller,</text>
      <text x="188" y="313" class="soft-text" font-size="18">agent-ready workflows: structured notes, RSS context, and local</text>
      <text x="188" y="348" class="soft-text" font-size="18">files all feed into the same conversation state.</text>

      <rect x="188" y="428" width="320" height="48" rx="9" fill="#191d27" stroke="#2b3240"/>
      <path d="m211 444 4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#3b82f6"/>
      <text x="238" y="459" class="muted" font-size="15">thinking streamed live...</text>

      <rect x="150" y="538" width="820" height="76" rx="16" fill="#191d27" stroke="#2b3240"/>
      <text x="188" y="584" class="muted" font-size="18">Ask a follow-up, attach files, or stop generation mid-stream...</text>
      <rect x="884" y="552" width="48" height="48" rx="24" fill="#3b82f6"/>
      <path d="m902 567 22 9-22 9 6-9z" fill="#ffffff"/>
