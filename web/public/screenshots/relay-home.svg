      <polygon points="11 0 22 30 0 30" transform="translate(96 38) rotate(75 11 15)" fill="#3b82f6"/>
      <polygon points="11 0 22 30 0 30" transform="translate(98 64) rotate(110 11 15)" fill="#6fa1f8"/>
      <polygon points="11 0 22 30 0 30" transform="translate(84 90) rotate(150 11 15)" fill="#3b82f6"/>
      <polygon points="11 0 22 30 0 30" transform="translate(60 102) rotate(180 11 15)" fill="#93bdfb"/>
      <polygon points="11 0 22 30 0 30" transform="translate(36 96) rotate(215 11 15)" fill="#3b82f6"/>
      <polygon points="11 0 22 30 0 30" transform="translate(16 76) rotate(250 11 15)" fill="#6fa1f8"/>
