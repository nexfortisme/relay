      <polygon points="11 0 22 30 0 30" transform="translate(44 70) rotate(245 11 15) scale(.7)" fill="#93bdfb"/>
      <circle cx="70" cy="70" r="6" fill="#191d27"/>
    </symbol>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity=".22"/>
    </filter>
    <style>
      .text { fill: #f4f7fb; }
      .muted { fill: #9aa5b5; }
      .soft-text { fill: #d6dce7; }
      .small { font-size: 15px; }
      .label { font-size: 13px; font-weight: 700; }
      .divider { stroke: #2b3240; stroke-width: 1.5; }
      .icon { fill: none; stroke: #9aa5b5; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .icon-light { fill: none; stroke: #f4f7fb; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .icon-primary { fill: none; stroke: #ffffff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

